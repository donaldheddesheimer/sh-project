<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title description">
  <title id="title">Incident response workflow</title>
  <desc id="description">Four stages: detect the incident, evaluate responses in parallel simulations, decide on a validated recommendation, then apply, monitor, and learn.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="24" fill="url(#background)"/>
  <path d="M282 120h24M568 120h24M854 120h24" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="32" y="40" width="250" height="160" rx="18" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="66" cy="75" r="18" fill="url(#blue)"/>
    <text x="66" y="81" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">1</text>
    <text x="94" y="82" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">DETECT</text>
    <text x="56" y="128" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Incident detected</text>
    <text x="56" y="160" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="16">Capture the live city</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="318" y="40" width="250" height="160" rx="18" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="352" cy="75" r="18" fill="url(#blue)"/>
    <text x="352" y="81" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">2</text>
    <text x="380" y="82" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">EVALUATE</text>
    <text x="342" y="128" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Test responses</text>
    <text x="342" y="160" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="16">Validate + simulate in parallel</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="604" y="40" width="250" height="160" rx="18" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="638" cy="75" r="18" fill="url(#blue)"/>
    <text x="638" y="81" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">3</text>
    <text x="666" y="82" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">DECIDE</text>
    <text x="628" y="128" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Compare outcomes</text>
    <text x="628" y="160" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="16">Recommend a safe plan</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="40" width="278" height="160" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="924" cy="75" r="18" fill="url(#teal)"/>
    <text x="924" y="81" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">4</text>
    <text x="952" y="82" fill="#99f6e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">LEARN</text>
    <text x="914" y="128" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Apply and monitor</text>
    <text x="914" y="160" fill="#ccfbf1" font-family="Inter, system-ui, sans-serif" font-size="16">Measure results + remember</text>
  </g>
</svg>
